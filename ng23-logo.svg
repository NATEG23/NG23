<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img" aria-labelledby="title desc">
<title id="title">NG23 logo</title>
<desc id="desc">Bold NG23 wordmark with a collective badge and golf-inspired accent.</desc>
<defs>
  <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#fff176"/>
    <stop offset="45%" stop-color="#ffd000"/>
    <stop offset="100%" stop-color="#ff9f1a"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="45%" stop-color="#d7dce8"/>
    <stop offset="100%" stop-color="#8c93a3"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".55"/>
  </filter>
</defs>
<rect width="520" height="180" rx="34" fill="#07080d"/>
<circle cx="432" cy="48" r="28" fill="none" stroke="url(#gold)" stroke-width="8" opacity=".95"/>
<circle cx="432" cy="48" r="7" fill="url(#gold)"/>
<path d="M420 95 C445 88, 463 103, 462 126" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".8"/>
<text x="48" y="112" font-family="Arial Black, Impact, sans-serif" font-size="78" font-style="italic" letter-spacing="-5" filter="url(#shadow)">
  <tspan fill="url(#steel)">NG</tspan><tspan fill="url(#gold)">23</tspan>
</text>
<text x="55" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#ffffff" opacity=".85">THE COLLECTIVE</text>
</svg>